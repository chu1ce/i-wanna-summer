<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>До лета</title>

  <!-- JetBrains Mono (для цифр) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #ffffff;
      --card: #ffffff;
      --stroke: rgba(0,0,0,.10);
      --text: rgba(0,0,0,.88);
      --muted: rgba(0,0,0,.56);
      --radius: 18px;

      /* фиксированная высота виджета под iframe */
      --widget-w: 360px;
      --widget-h: 190px;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      background: var(--bg);
      display:grid;
      place-items:center;
      font-family: Helvetica, Arial, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      padding: 10px;
    }

    .widget{
      width: min(var(--widget-w), 100%);
      height: var(--widget-h);
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--stroke);
      padding: 14px 14px 12px;
      overflow: hidden;
    }

    .top{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title{
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
      margin:0;
      display:flex;
      align-items:center;
      gap: 6px;
      white-space: nowrap;
    }

    .badge{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--stroke);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      background: rgba(0,0,0,.02);
    }

    /* зона контента фиксирована — без прыжков */
    .bodyArea{
      position: relative;
      height: calc(var(--widget-h) - 14px - 12px - 10px - 22px); /* грубая стабилизация */
      min-height: 120px;
    }

    .panel{
      position:absolute;
      inset:0;
      display:grid;
      align-content:center;
      transition: opacity .18s ease;
    }
    .panel[hidden]{
      opacity: 0;
      pointer-events: none;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 8px;
    }

    .cell{
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 10px 8px 8px;
      text-align:center;
      background: rgba(0,0,0,.02);
      min-height: 66px;
      display:grid;
      align-content:center;
      gap: 4px;
    }

    .num{
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.2px;
    }

    .lbl{
      font-size: 11px;
      color: var(--muted);
      line-height: 1.1;
    }

    .summerBox{
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 14px 12px;
      text-align:center;
      background: rgba(0,0,0,.02);
      width: 100%;
    }
    .summerBox h2{
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: .2px;
    }
    .summerBox p{
      margin:0;
      color: var(--muted);
      font-size: 13px;
    }

    /* узкие iframe */
    @media (max-width: 340px){
      :root{ --widget-h: 240px; }
      .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); }
      .title{ white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="widget" role="group" aria-label="Счётчик до лета">
    <div class="top">
      <h1 class="title" id="headline">До лета осталось <span aria-hidden="true">☀️</span></h1>
      <div class="badge" id="targetText">01.06</div>
    </div>

    <div class="bodyArea">
      <!-- Countdown -->
      <div class="panel" id="countdownPanel">
        <div class="grid">
          <div class="cell">
            <div class="num" id="m">–</div>
            <div class="lbl" id="mlbl">месяцев</div>
          </div>
          <div class="cell">
            <div class="num" id="d">–</div>
            <div class="lbl" id="dlbl">дней</div>
          </div>
          <div class="cell">
            <div class="num" id="h">–</div>
            <div class="lbl" id="hlbl">часов</div>
          </div>
          <div class="cell">
            <div class="num" id="min">–</div>
            <div class="lbl" id="minlbl">минут</div>
          </div>
          <div class="cell">
            <div class="num" id="s">–</div>
            <div class="lbl" id="slbl">секунд</div>
          </div>
        </div>
      </div>

      <!-- Summer -->
      <div class="panel" id="summerPanel" hidden>
        <div class="summerBox">
          <h2>Сейчас лето ☀️</h2>
          <p>Время наслаждаться тёплыми днями.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Москва (MSK) — UTC+3. Считаем в "сдвинутых" миллисекундах:
    // shiftedMs = realUtcMs + offsetMs; затем берём getUTC* как "время по МСК".
    const MSK_OFFSET_MIN = 180;
    const OFFSET_MS = MSK_OFFSET_MIN * 60_000;

    const $ = (id) => document.getElementById(id);
    const nowShiftedMs = () => Date.now() + OFFSET_MS;

    function ruPlural(n, one, few, many){
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return few;
      return many;
    }

    function addMonthsClamped(dateShifted, monthsToAdd){
      const y = dateShifted.getUTCFullYear();
      const m1 = dateShifted.getUTCMonth() + 1; // 1..12
      const day = dateShifted.getUTCDate();
      const hh = dateShifted.getUTCHours();
      const mm = dateShifted.getUTCMinutes();
      const ss = dateShifted.getUTCSeconds();

      const total = (m1 - 1) + monthsToAdd;
      const y2 = y + Math.floor(total / 12);
      const m2 = (total % 12) + 1; // 1..12

      const lastDay = new Date(Date.UTC(y2, m2, 0)).getUTCDate();
      const day2 = Math.min(day, lastDay);

      return new Date(Date.UTC(y2, m2 - 1, day2, hh, mm, ss));
    }

    function wholeMonthsBetween(nowD, targetD){
      let months = 0;
      let cursor = nowD;
      while (true){
        const next = addMonthsClamped(cursor, 1);
        if (next.getTime() <= targetD.getTime()){
          cursor = next;
          months++;
          if (months > 36) break;
        } else break;
      }
      return { months, cursor };
    }

    function showSummer(isSummer){
      $("summerPanel").hidden = !isSummer;
      $("countdownPanel").hidden = isSummer;

      if (isSummer){
        $("headline").innerHTML = `Сейчас лето <span aria-hidden="true">☀️</span>`;
        $("targetText").textContent = "☀️";
      } else {
        $("headline").innerHTML = `До лета осталось <span aria-hidden="true">☀️</span>`;
      }
    }

    function tick(){
      const nowS = nowShiftedMs();
      const nowD = new Date(nowS);
      const year = nowD.getUTCFullYear();

      // Лето: [01.06 00:00, 01.09 00:00) по МСК
      const summerStartS = Date.UTC(year, 5, 1, 0, 0, 0);
      const summerEndS   = Date.UTC(year, 8, 1, 0, 0, 0);
      const isSummer = (nowS >= summerStartS) && (nowS < summerEndS);

      showSummer(isSummer);
      if (isSummer) return;

      // Цель: ближайшее 01.06 00:00 по МСК
      const targetYear = (nowS < summerStartS) ? year : (year + 1);
      const targetS = Date.UTC(targetYear, 5, 1, 0, 0, 0);
      const targetD = new Date(targetS);

      $("targetText").textContent = `01.06.${targetYear}`;

      // Месяцы (календарные) + остаток
      const { months, cursor } = wholeMonthsBetween(nowD, targetD);
      let restMs = targetS - cursor.getTime();
      if (restMs < 0) restMs = 0;

      const dayMs = 24 * 60 * 60 * 1000;
      const hourMs = 60 * 60 * 1000;
      const minMs = 60 * 1000;

      const days = Math.floor(restMs / dayMs); restMs -= days * dayMs;
      const hours = Math.floor(restMs / hourMs); restMs -= hours * hourMs;
      const mins = Math.floor(restMs / minMs); restMs -= mins * minMs;
      const secs = Math.floor(restMs / 1000);

      $("m").textContent = months;
      $("d").textContent = days;
      $("h").textContent = hours;
      $("min").textContent = mins;
      $("s").textContent = secs;

      $("mlbl").textContent   = ruPlural(months, "месяц", "месяца", "месяцев");
      $("dlbl").textContent   = ruPlural(days,   "день", "дня", "дней");
      $("hlbl").textContent   = ruPlural(hours,  "час", "часа", "часов");
      $("minlbl").textContent = ruPlural(mins,   "минута", "минуты", "минут");
      $("slbl").textContent   = ruPlural(secs,   "секунда", "секунды", "секунд");
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
