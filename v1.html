<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>До лета</title>
  <style>
    :root{
      --bg: #ffffff;
      --card: #ffffff;
      --stroke: rgba(0,0,0,.10);
      --text: rgba(0,0,0,.88);
      --muted: rgba(0,0,0,.56);
      --radius: 16px;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      padding: 10px;
    }

    .widget{
      width: min(360px, 100%);
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--stroke);
      padding: 14px 14px 12px;
      overflow: hidden;
    }

    .top{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .title{
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .2px;
      margin:0;
    }
    .badge{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--stroke);
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
      background: rgba(0,0,0,.02);
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 8px;
      margin-top: 6px;
    }

    .cell{
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 10px 8px 8px;
      text-align:center;
      background: rgba(0,0,0,.02);
      min-height: 64px;
      display:grid;
      align-content:center;
      gap: 4px;
    }

    .num{
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      font-weight: 750;
      line-height: 1.05;
    }
    .lbl{
      font-size: 11px;
      color: var(--muted);
      line-height: 1.1;
    }

    .summer{
      display:none;
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 14px 12px;
      text-align:center;
      background: rgba(0,0,0,.02);
    }
    .summer h2{
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: .2px;
    }
    .summer p{
      margin:0;
      color: var(--muted);
      font-size: 13px;
    }

    .footer{
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .dot{
      width:6px;height:6px;border-radius:50%;
      background: rgba(0,0,0,.25);
      display:inline-block;
      transform: translateY(-1px);
    }

    @media (max-width: 340px){
      .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="widget" role="group" aria-label="Счётчик до лета">
    <div class="top">
      <h1 class="title" id="headline">До лета осталось</h1>
      <div class="badge" id="targetText">01.06</div>
    </div>

    <div class="summer" id="summerBox">
      <h2>Сейчас лето ☀️</h2>
      <p>Время наслаждаться тёплыми днями.</p>
    </div>

    <div id="countdownBox">
      <div class="grid" id="grid">
        <div class="cell"><div class="num" id="m">–</div><div class="lbl">месяцев</div></div>
        <div class="cell"><div class="num" id="d">–</div><div class="lbl">дней</div></div>
        <div class="cell"><div class="num" id="h">–</div><div class="lbl">часов</div></div>
        <div class="cell"><div class="num" id="min">–</div><div class="lbl">минут</div></div>
        <div class="cell"><div class="num" id="s">–</div><div class="lbl">секунд</div></div>
      </div>
    </div>

    <div class="footer">
      <span class="dot"></span>
      <span id="mskNow">МСК: —</span>
    </div>
  </div>

  <script>
    // Считаем в "сдвинутых" миллисекундах: UTC + 3 часа (Москва).
    const MSK_OFFSET_MIN = 180;
    const OFFSET_MS = MSK_OFFSET_MIN * 60_000;

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");
    const nowShiftedMs = () => Date.now() + OFFSET_MS;

    function addMonthsClamped(dateShifted, monthsToAdd){
      const y = dateShifted.getUTCFullYear();
      const m1 = dateShifted.getUTCMonth() + 1; // 1..12
      const day = dateShifted.getUTCDate();
      const hh = dateShifted.getUTCHours();
      const mm = dateShifted.getUTCMinutes();
      const ss = dateShifted.getUTCSeconds();

      const total = (m1 - 1) + monthsToAdd;
      const y2 = y + Math.floor(total / 12);
      const m2 = (total % 12) + 1; // 1..12

      const lastDay = new Date(Date.UTC(y2, m2, 0)).getUTCDate();
      const day2 = Math.min(day, lastDay);

      return new Date(Date.UTC(y2, m2 - 1, day2, hh, mm, ss));
    }

    function wholeMonthsBetween(nowD, targetD){
      let months = 0;
      let cursor = nowD;
      while (true){
        const next = addMonthsClamped(cursor, 1);
        if (next.getTime() <= targetD.getTime()){
          cursor = next;
          months++;
          if (months > 36) break;
        } else break;
      }
      return { months, cursor };
    }

    function formatMskNow(shiftedMs){
      const d = new Date(shiftedMs);
      const y = d.getUTCFullYear();
      const mo = pad2(d.getUTCMonth()+1);
      const da = pad2(d.getUTCDate());
      const hh = pad2(d.getUTCHours());
      const mm = pad2(d.getUTCMinutes());
      const ss = pad2(d.getUTCSeconds());
      return `${da}.${mo}.${y} ${hh}:${mm}:${ss}`;
    }

    function tick(){
      const nowS = nowShiftedMs();
      const nowD = new Date(nowS);
      const year = nowD.getUTCFullYear();

      // Лето: [01.06 00:00, 01.09 00:00) по МСК
      const summerStartS = Date.UTC(year, 5, 1, 0, 0, 0);
      const summerEndS   = Date.UTC(year, 8, 1, 0, 0, 0);

      $("mskNow").textContent = `МСК: ${formatMskNow(nowS)}`;

      const isSummer = (nowS >= summerStartS) && (nowS < summerEndS);

      if (isSummer){
        $("summerBox").style.display = "block";
        $("countdownBox").style.display = "none";
        $("headline").textContent = "Сейчас лето";
        $("targetText").textContent = "☀️";
        return;
      } else {
        $("summerBox").style.display = "none";
        $("countdownBox").style.display = "block";
        $("headline").textContent = "До лета осталось";
      }

      const targetYear = (nowS < summerStartS) ? year : (year + 1);
      const targetS = Date.UTC(targetYear, 5, 1, 0, 0, 0);
      const targetD = new Date(targetS);

      $("targetText").textContent = `01.06.${targetYear}`;

      const { months, cursor } = wholeMonthsBetween(nowD, targetD);
      let restMs = targetS - cursor.getTime();
      if (restMs < 0) restMs = 0;

      const dayMs = 24 * 60 * 60 * 1000;
      const hourMs = 60 * 60 * 1000;
      const minMs = 60 * 1000;

      const days = Math.floor(restMs / dayMs); restMs -= days * dayMs;
      const hours = Math.floor(restMs / hourMs); restMs -= hours * hourMs;
      const mins = Math.floor(restMs / minMs); restMs -= mins * minMs;
      const secs = Math.floor(restMs / 1000);

      $("m").textContent = months;
      $("d").textContent = days;
      $("h").textContent = hours;
      $("min").textContent = mins;
      $("s").textContent = secs;
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
